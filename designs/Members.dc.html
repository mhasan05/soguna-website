<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAFAF7;font-family:'Hind Siliguri',sans-serif;}a{color:#15803D;text-decoration:none;}a:hover{color:#14532D;text-decoration:underline;}</style>
</helmet>
<div ref="{{ rootRef }}" style="container-type:inline-size;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:#FAFAF7;color:#1C1917;font-size:16px;line-height:1.6;">
<div style="position:sticky;top:0;z-index:20;"><dc-import name="SiteHeader" mode="{{ mode }}" active="none" hint-size="100%,72px"></dc-import></div>

<div data-screen-label="সদস্য তালিকা" style="max-width:1200px;margin:0 auto;padding:clamp(20px,3cqw,40px) clamp(16px,3.5cqw,40px) clamp(40px,5cqw,64px);display:flex;flex-direction:column;gap:14px;">
  <sc-if value="{{ listView }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;">
      <h1 style="margin:0;font-size:clamp(26px,3cqw,36px);font-weight:700;line-height:1.3;">সদস্য তালিকা</h1>
      <span style="font-size:16px;color:#57534E;">{{ countLabel }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;height:56px;border:1.5px solid #D6D3CB;border-radius:12px;background:#fff;padding:0 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input value="{{ q }}" onChange="{{ setQ }}" placeholder="নাম বা ফোন দিয়ে খুঁজুন" style="flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:18px;background:transparent;">
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,46%),1fr));gap:8px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <select value="{{ f.value }}" onChange="{{ f.set }}" aria-label="{{ f.label }}" style="height:52px;border-radius:10px;border:1.5px solid {{ f.border }};background:#fff;padding:0 10px;font-family:inherit;font-size:16px;color:#1C1917;min-width:0;">
          <sc-for list="{{ f.options }}" as="o"><option value="{{ o }}">{{ o }}</option></sc-for>
        </select>
      </sc-for>
    </div>
    <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <button onClick="{{ r.open }}" style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:14px;text-align:left;font-family:inherit;color:#1C1917;cursor:pointer;min-height:80px;">
            <div style="width:52px;height:52px;flex:none;border-radius:50%;background:#F0FDF4;color:#15803D;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;">{{ r.initial }}</div>
            <div style="flex:1;min-width:0;"><div style="font-size:17px;font-weight:600;line-height:1.4;">{{ r.name }}</div><div style="font-size:15px;color:#57534E;">{{ r.para }} · {{ r.job }}</div></div>
            <span style="font-size:14px;font-weight:700;color:#DC2626;flex:none;">{{ r.blood }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}">
      <div style="background:#fff;border:1px dashed #D6D3CB;border-radius:12px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div style="font-size:18px;font-weight:600;">কাউকে পাওয়া যায়নি</div>
        <button onClick="{{ clear }}" style="height:48px;padding:0 20px;border-radius:10px;border:1.5px solid #15803D;background:#fff;color:#15803D;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;">ফিল্টার মুছুন</button>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{ detailView }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ back }}" style="align-self:flex-start;min-height:48px;border:none;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:17px;font-weight:600;color:#15803D;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>সদস্য তালিকা</button>
    <div style="max-width:560px;width:100%;background:#fff;border:1px solid #E7E5DF;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-sizing:border-box;">
      <div style="width:96px;height:96px;border-radius:50%;background:#F0FDF4;color:#15803D;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;">{{ cur.initial }}</div>
      <h2 style="margin:6px 0 0;font-size:24px;font-weight:700;">{{ cur.name }}</h2>
      <div style="font-size:16px;color:#57534E;">{{ cur.para }} · {{ cur.job }} · {{ cur.loc }}</div>
      <span style="margin-top:4px;font-size:15px;font-weight:700;padding:2px 12px;border-radius:999px;background:#FEF2F2;color:#B91C1C;">রক্ত {{ cur.blood }}</span>
      <sc-if value="{{ cur.canCall }}" hint-placeholder-val="{{ true }}">
        <div style="width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:14px;">
          <a href="#" style="height:52px;border-radius:10px;background:#15803D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;text-decoration:none;">কল করুন</a>
          <a href="#" style="height:52px;border-radius:10px;border:1.5px solid #15803D;color:#15803D;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;text-decoration:none;box-sizing:border-box;">WhatsApp</a>
        </div>
      </sc-if>
      <sc-if value="{{ cur.hidden }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;margin-top:14px;background:#F5F5F4;border-radius:10px;padding:12px;font-size:16px;color:#57534E;box-sizing:border-box;">এই সদস্য ফোন নম্বর গোপন রেখেছেন।</div>
      </sc-if>
    </div>
  </sc-if>
</div>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}"><div style="position:sticky;bottom:0;z-index:20;"><dc-import name="BottomNav" active="me" hint-size="100%,68px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 0, q: '', para: 'সব পাড়া', job: 'সব পেশা', blood: 'সব গ্রুপ', loc: 'সব জায়গা', open: -1 };
  rootRef = React.createRef();
  componentDidMount() { const el = this.rootRef.current; if (!el) return; this.ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width })); this.ro.observe(el); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const m = this.props.mode; const mode = m && m !== 'auto' ? m : (this.state.w >= 900 ? 'desktop' : 'mobile');
    const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const S = this.state;
    const all = [
      ['মোঃ রফিকুল ইসলাম', 'মধ্যপাড়া', 'শিক্ষক', 'O+', 'গ্রামে'], ['মোঃ সাইফুল হাসান', 'উত্তরপাড়া', 'ব্যবসায়ী', 'A+', 'গ্রামে'], ['মোঃ রাকিব হাসান', 'নদীপাড়া', 'চাকরিজীবী', 'B+', 'ঢাকায়'],
      ['মোঃ সোহেল রানা', 'মধ্যপাড়া', 'তাঁতি', 'B+', 'গ্রামে'], ['আব্দুল্লাহ আল মামুন', 'পশ্চিমপাড়া', 'প্রবাসী শ্রমিক', 'O+', 'প্রবাসে'], ['মোঃ শামীম হোসেন', 'দক্ষিণপাড়া', 'কৃষক', 'AB+', 'গ্রামে'],
      ['মোঃ ফারুক আহমেদ', 'পূর্বপাড়া', 'শিক্ষার্থী', 'A−', 'অন্য জেলায়'], ['মোঃ রুবেল মিয়া', 'নদীপাড়া', 'তাঁতি', 'O−', 'গ্রামে'], ['মোঃ জসিম উদ্দিন', 'উত্তরপাড়া', 'প্রবাসী শ্রমিক', 'B−', 'প্রবাসে'],
      ['মোঃ হাবিবুর রহমান', 'দক্ষিণপাড়া', 'ব্যবসায়ী', 'O+', 'গ্রামে'], ['মোঃ নাজমুল হক', 'পূর্বপাড়া', 'চাকরিজীবী', 'A+', 'ঢাকায়'], ['মোঃ তানভীর আহমেদ', 'পশ্চিমপাড়া', 'শিক্ষার্থী', 'B+', 'গ্রামে']
    ].map(([name, para, job, blood, loc], i) => ({ name, para, job, blood, loc, initial: name.replace('মোঃ ', '')[0], canCall: i % 5 !== 4, hidden: i % 5 === 4, open: () => this.setState({ open: i }) }));
    const qq = S.q.trim();
    const rows = all.filter(r => (!qq || r.name.includes(qq)) && (S.para === 'সব পাড়া' || r.para === S.para) && (S.job === 'সব পেশা' || r.job === S.job) && (S.blood === 'সব গ্রুপ' || r.blood === S.blood) && (S.loc === 'সব জায়গা' || r.loc === S.loc));
    const mk = (key, label, first, opts) => ({ label, value: S[key], border: S[key] === first ? '#D6D3CB' : '#15803D', options: [first, ...opts], set: e => this.setState({ [key]: e.target.value }) });
    return {
      rootRef: this.rootRef, mode, isMobile: mode === 'mobile',
      listView: S.open < 0, detailView: S.open >= 0, cur: S.open >= 0 ? all[S.open] : {}, back: () => this.setState({ open: -1 }),
      q: S.q, setQ: e => this.setState({ q: e.target.value }),
      filters: [mk('para', 'পাড়া', 'সব পাড়া', ['উত্তরপাড়া', 'দক্ষিণপাড়া', 'মধ্যপাড়া', 'পূর্বপাড়া', 'পশ্চিমপাড়া', 'নদীপাড়া']), mk('job', 'পেশা', 'সব পেশা', ['তাঁতি', 'কৃষক', 'শিক্ষক', 'শিক্ষার্থী', 'ব্যবসায়ী', 'চাকরিজীবী', 'প্রবাসী শ্রমিক']), mk('blood', 'রক্তের গ্রুপ', 'সব গ্রুপ', ['A+', 'A−', 'B+', 'B−', 'O+', 'O−', 'AB+', 'AB−']), mk('loc', 'বর্তমান অবস্থান', 'সব জায়গা', ['গ্রামে', 'ঢাকায়', 'অন্য জেলায়', 'প্রবাসে'])],
      rows, hasRows: rows.length > 0, noRows: rows.length === 0,
      countLabel: bn(rows.length) + ' জন দেখানো হচ্ছে · মোট ১২২',
      clear: () => this.setState({ q: '', para: 'সব পাড়া', job: 'সব পেশা', blood: 'সব গ্রুপ', loc: 'সব জায়গা' })
    };
  }
}
</script>
</body>
</html>

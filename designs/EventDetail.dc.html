<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAFAF7;font-family:'Hind Siliguri',sans-serif;}a{color:#15803D;text-decoration:none;}a:hover{color:#14532D;text-decoration:underline;}</style>
</helmet>
<div ref="{{ rootRef }}" style="container-type:inline-size;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:#FAFAF7;color:#1C1917;font-size:16px;line-height:1.6;">
<div style="position:sticky;top:0;z-index:20;"><dc-import name="SiteHeader" mode="{{ mode }}" active="events" hint-size="100%,72px"></dc-import></div>

<section data-screen-label="ইভেন্ট বিস্তারিত" style="position:relative;background:#14532D;color:#fff;overflow:hidden;">
  <img src="{{ cover }}" alt="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,83,45,.25),rgba(20,83,45,.92));"></div>
  <div style="position:relative;max-width:1000px;margin:0 auto;padding:clamp(100px,14cqw,180px) clamp(16px,3.5cqw,40px) clamp(28px,4cqw,44px);">
    <a href="Events.dc.html" style="color:#fff;font-size:16px;display:inline-flex;align-items:center;gap:6px;min-height:44px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>সব কার্যক্রম</a>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <span style="font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:#fff;color:#14532D;">{{ cat }}</span>
      <span style="font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:{{ statusBg }};color:#fff;">{{ statusLabel }}</span>
    </div>
    <h1 style="margin:10px 0 0;font-size:clamp(28px,4cqw,48px);font-weight:700;line-height:1.3;text-wrap:balance;">{{ title }}</h1>
  </div>
</section>

<div style="max-width:1000px;margin:0 auto;padding:clamp(20px,3cqw,36px) clamp(16px,3.5cqw,40px) clamp(40px,5cqw,64px);display:flex;flex-direction:column;gap:20px;">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;">
    <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:16px;display:flex;gap:12px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><div><div style="font-size:15px;color:#57534E;">তারিখ ও সময়</div><div style="font-size:18px;font-weight:600;">{{ when }}</div></div></div>
    <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:16px;display:flex;gap:12px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg><div><div style="font-size:15px;color:#57534E;">স্থান</div><div style="font-size:18px;font-weight:600;">{{ place }}</div></div></div>
  </div>

  <sc-if value="{{ isUpcoming }}" hint-placeholder-val="{{ true }}">
    <div style="background:#F0FDF4;border:1px solid #DCEFE1;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;">
      <div style="font-size:17px;font-weight:600;color:#14532D;">শুরু হতে বাকি</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:360px;">
        <sc-for list="{{ countdown }}" as="c" hint-placeholder-count="4">
          <div style="background:#fff;border-radius:10px;padding:10px 4px;text-align:center;"><div style="font-size:clamp(26px,3cqw,34px);font-weight:700;color:#15803D;line-height:1.1;">{{ c.v }}</div><div style="font-size:14px;color:#57534E;">{{ c.l }}</div></div>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
        <sc-if value="{{ notGoing }}" hint-placeholder-val="{{ true }}"><button onClick="{{ toggleGo }}" style="height:56px;padding:0 28px;border-radius:10px;border:none;background:#15803D;color:#fff;font-family:inherit;font-size:19px;font-weight:700;cursor:pointer;">আমি আসছি</button></sc-if>
        <sc-if value="{{ going }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toggleGo }}" style="height:56px;padding:0 24px;border-radius:10px;border:1.5px solid #15803D;background:#fff;color:#15803D;font-family:inherit;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>আপনি আসছেন</button></sc-if>
        <span style="font-size:17px;color:#44403C;">{{ countLabel }}</span>
      </div>
      <label style="display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-size:17px;">
        <input type="checkbox" checked="{{ volunteer }}" onChange="{{ toggleVol }}" style="width:24px;height:24px;accent-color:#15803D;">
        আমি স্বেচ্ছাসেবক হিসেবে কাজ করতে চাই
      </label>
    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:14px;">
      <h2 style="margin:0;font-size:clamp(22px,2.4cqw,30px);font-weight:700;">কার্যক্রমের রিপোর্ট</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;">
        <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:16px;"><div style="font-size:32px;font-weight:700;color:#15803D;line-height:1.1;">১২০</div><div style="color:#57534E;">পরিবার উপকৃত</div></div>
        <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:16px;"><div style="font-size:32px;font-weight:700;color:#B45309;line-height:1.1;">৳৮৪,৫০০</div><div style="color:#57534E;">মোট খরচ</div></div>
        <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:16px;"><div style="font-size:32px;font-weight:700;color:#15803D;line-height:1.1;">৩৬</div><div style="color:#57534E;">স্বেচ্ছাসেবক</div></div>
      </div>
      <a href="Finance.dc.html" style="align-self:flex-start;min-height:48px;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:600;">খরচের পুরো হিসাব দেখুন →</a>
    </div>
  </sc-if>

  <div>
    <h2 style="margin:0 0 8px;font-size:clamp(22px,2.4cqw,30px);font-weight:700;">বিবরণ</h2>
    <p style="margin:0;font-size:18px;line-height:1.75;color:#292524;text-wrap:pretty;">{{ desc }}</p>
  </div>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div>
      <h2 style="margin:0 0 12px;font-size:clamp(22px,2.4cqw,30px);font-weight:700;">ছবি</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:8px;">
        <sc-for list="{{ photos }}" as="p" hint-placeholder-count="6"><img src="{{ p }}" alt="কার্যক্রমের ছবি" loading="lazy" style="display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#E3E6D9;"></sc-for>
      </div>
    </div>
  </sc-if>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;">
    <button style="height:52px;border-radius:10px;border:1.5px solid #15803D;background:#fff;color:#15803D;font-family:inherit;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>WhatsApp-এ শেয়ার</button>
    <button style="height:52px;border-radius:10px;border:1.5px solid #15803D;background:#fff;color:#15803D;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;">Facebook-এ শেয়ার</button>
  </div>
</div>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}"><div style="position:sticky;bottom:0;z-index:20;"><dc-import name="BottomNav" active="events" hint-size="100%,68px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;upcoming&quot;,&quot;completed&quot;],&quot;default&quot;:&quot;upcoming&quot;,&quot;tsType&quot;:&quot;'upcoming'|'completed'&quot;}}">
class Component extends DCLogic {
  state = { w: 0, going: false, volunteer: false, now: Date.now() };
  rootRef = React.createRef();
  componentDidMount() { const el = this.rootRef.current; if (el) { this.ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width })); this.ro.observe(el); } this.t = setInterval(() => this.setState({ now: Date.now() }), 30000); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); clearInterval(this.t); }
  renderVals() {
    const m = this.props.mode; const mode = m && m !== 'auto' ? m : (this.state.w >= 900 ? 'desktop' : 'mobile');
    const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const F = (n, w = 1400) => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + n + '?width=' + w;
    const done = (this.props.status ?? 'upcoming') === 'completed';
    const diff = Math.max(0, new Date(2026, 11, 13, 9, 0) - this.state.now);
    const cd = [[Math.floor(diff / 864e5), 'দিন'], [Math.floor(diff / 36e5) % 24, 'ঘণ্টা'], [Math.floor(diff / 6e4) % 60, 'মিনিট'], [this.state.going ? 1 : 0, '']];
    const base = done ? {
      cat: 'দুর্যোগে সহায়তা', title: 'যমুনার বন্যায় ত্রাণ বিতরণ', cover: F('Sariakandi_Char_Land_Flood_Affected_Bangladesh.jpg'), when: '১৮ আগস্ট ২০২৬, মঙ্গলবার', place: 'নদীপাড়া ও চরাঞ্চল',
      desc: 'যমুনার পানি বেড়ে নদীপাড়া ও চরের ১২০টি পরিবার ঘরছাড়া হয়। সদস্য ও প্রবাসীদের দানে চাল, ডাল, তেল, শুকনো খাবার, খাবার স্যালাইন আর ওষুধের প্যাকেট তৈরি করে নৌকায় করে পৌঁছে দেওয়া হয়।'
    } : {
      cat: 'শীতবস্ত্র বিতরণ', title: 'শীতবস্ত্র বিতরণ ২০২৬', cover: F('A_smiling_farmer_on_a_winter_morning.jpg'), when: '১৩ ডিসেম্বর ২০২৬, শনিবার · সকাল ৯টা', place: 'সগুনা সরকারি প্রাথমিক বিদ্যালয় মাঠ',
      desc: 'এবার ৩০০ পরিবারের হাতে কম্বল ও শীতের কাপড় তুলে দেওয়ার লক্ষ্য। প্রতিটি পাড়ার স্বেচ্ছাসেবকেরা আগে থেকে দুস্থ পরিবারের তালিকা যাচাই করবেন। বয়স্ক ও অসুস্থদের কম্বল বাড়িতে পৌঁছে দেওয়া হবে।'
    };
    return {
      rootRef: this.rootRef, mode, isMobile: mode === 'mobile', ...base,
      isUpcoming: !done, isDone: done,
      statusLabel: done ? 'সম্পন্ন' : 'আসন্ন', statusBg: done ? '#57534E' : '#D97706',
      countdown: cd.slice(0, 3).map(([v, l]) => ({ v: bn(v), l })),
      going: this.state.going, notGoing: !this.state.going, toggleGo: () => this.setState(s => ({ going: !s.going })),
      countLabel: bn(42 + (this.state.going ? 1 : 0)) + ' জন আসছেন · ' + bn(9 + (this.state.volunteer ? 1 : 0)) + ' জন স্বেচ্ছাসেবক',
      volunteer: this.state.volunteer, toggleVol: () => this.setState(s => ({ volunteer: !s.volunteer })),
      photos: ['Sariakandi_Char_Land_Flood_Affected_Bangladesh.jpg', 'Flood_in_Bangladesh.jpg', 'Canal_Of_Village.jpg', 'A_conversation_session_of_village_people.jpg', 'Village_river.jpg', 'River_side_road.jpg'].map(n => F(n, 500))
    };
  }
}
</script>
</body>
</html>

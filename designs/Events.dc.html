<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAFAF7;font-family:'Hind Siliguri',sans-serif;}a{color:#15803D;text-decoration:none;}a:hover{color:#14532D;text-decoration:underline;}</style>
</helmet>
<div ref="{{ rootRef }}" style="container-type:inline-size;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:#FAFAF7;color:#1C1917;font-size:16px;line-height:1.6;">
<div style="position:sticky;top:0;z-index:20;"><dc-import name="SiteHeader" mode="{{ mode }}" active="events" hint-size="100%,72px"></dc-import></div>

<section data-screen-label="কার্যক্রম ও ইভেন্ট">
  <div style="max-width:1200px;margin:0 auto;padding:clamp(28px,4cqw,48px) clamp(16px,3.5cqw,40px) 0;">
    <div style="font-size:15px;color:#57534E;">হোম / কার্যক্রম</div>
    <h1 style="margin:4px 0 16px;font-size:clamp(28px,3.4cqw,42px);font-weight:700;line-height:1.3;">কার্যক্রম ও ইভেন্ট</h1>
    <div style="display:grid;grid-template-columns:1fr 1fr;background:#EFEDE6;border-radius:12px;padding:4px;gap:4px;max-width:420px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><button onClick="{{ t.pick }}" style="height:48px;border:none;border-radius:9px;background:#fff;color:#14532D;font-family:inherit;font-size:17px;font-weight:700;box-shadow:0 1px 3px rgba(28,25,23,.12);cursor:pointer;">{{ t.label }}</button></sc-if>
        <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><button onClick="{{ t.pick }}" style="height:48px;border:none;border-radius:9px;background:transparent;color:#57534E;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;">{{ t.label }}</button></sc-if>
      </sc-for>
    </div>
  </div>
</section>

<section>
  <div style="max-width:1200px;margin:0 auto;padding:20px clamp(16px,3.5cqw,40px) clamp(40px,5cqw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;">
    <sc-for list="{{ items }}" as="e" hint-placeholder-count="4">
      <a href="{{ e.href }}" style="display:flex;flex-direction:column;text-decoration:none;color:#1C1917;background:#fff;border:1px solid #E7E5DF;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(28,25,23,.04);">
        <div style="position:relative;">
          <img src="{{ e.img }}" alt="{{ e.title }}" loading="lazy" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#E3E6D9;">
          <span style="position:absolute;left:12px;top:12px;font-size:14px;font-weight:600;padding:2px 12px;border-radius:999px;background:#fff;color:#14532D;">{{ e.cat }}</span>
        </div>
        <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;">
          <h3 style="margin:0;font-size:20px;font-weight:600;line-height:1.4;">{{ e.title }}</h3>
          <div style="display:flex;align-items:center;gap:8px;color:#57534E;font-size:16px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>{{ e.when }}</div>
          <div style="display:flex;align-items:flex-start;gap:8px;color:#57534E;font-size:16px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:3px;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>{{ e.place }}</div>
          <div style="margin-top:auto;padding-top:10px;font-size:16px;font-weight:600;color:{{ e.metaColor }};">{{ e.meta }}</div>
        </div>
      </a>
    </sc-for>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}"><div style="position:sticky;bottom:0;z-index:20;"><dc-import name="BottomNav" active="events" hint-size="100%,68px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 0, tab: 0 };
  rootRef = React.createRef();
  componentDidMount() { const el = this.rootRef.current; if (!el) return; this.ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width })); this.ro.observe(el); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const m = this.props.mode; const mode = m && m !== 'auto' ? m : (this.state.w >= 900 ? 'desktop' : 'mobile');
    const F = (n, w = 800) => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + n + '?width=' + w;
    const upcoming = [
      { cat: 'শীতবস্ত্র বিতরণ', img: F('A_smiling_farmer_on_a_winter_morning.jpg'), title: 'শীতবস্ত্র বিতরণ ২০২৬', when: '১৩ ডিসেম্বর, শনিবার · সকাল ৯টা', place: 'সগুনা সরকারি প্রাথমিক বিদ্যালয় মাঠ', meta: '৪২ জন আসছেন', href: 'EventDetail.dc.html' },
      { cat: 'রক্তদান ক্যাম্প', img: F('Village_children_in_Bangladesh.jpg'), title: 'স্বেচ্ছায় রক্তদান ক্যাম্প', when: '২৭ ডিসেম্বর, শনিবার · সকাল ১০টা', place: 'সগুনা বাজার, ক্লাব ঘর', meta: '২৮ জন আসছেন', href: 'EventDetail.dc.html' },
      { cat: 'খেলাধুলা', img: F('Football_in_the_village_of_Bangladesh.jpg'), title: 'বিজয় দিবস ফুটবল টুর্নামেন্ট', when: '১৬ ডিসেম্বর, বুধবার · দুপুর ২টা', place: 'সগুনা স্কুল মাঠ', meta: '৮টি দল নিবন্ধিত', href: 'EventDetail.dc.html' },
      { cat: 'সভা', img: F('A_conversation_session_of_village_people.jpg'), title: 'বার্ষিক সাধারণ সভা', when: '৯ জানুয়ারি ২০২৭, শুক্রবার · বাদ জুমা', place: 'সগুনা কেন্দ্রীয় জামে মসজিদ প্রাঙ্গণ', meta: '৬৫ জন আসছেন', href: 'EventDetail.dc.html' }
    ].map(e => ({ ...e, metaColor: '#15803D' }));
    const done = [
      { cat: 'দুর্যোগে সহায়তা', img: F('Sariakandi_Char_Land_Flood_Affected_Bangladesh.jpg'), title: 'যমুনার বন্যায় ত্রাণ বিতরণ', when: '১৮ আগস্ট ২০২৬', place: 'নদীপাড়া ও চরাঞ্চল', meta: '১২০ পরিবার উপকৃত · খরচ ৳৮৪,৫০০' },
      { cat: 'কৃষি সহায়তা', img: F('A_Farmer_walking_in_paddy_field.jpg'), title: 'বর্গাচাষিদের মাঝে আমন ধানের বীজ বিতরণ', when: '১২ জুলাই ২০২৬', place: 'সগুনা বাজার', meta: '৮৫ জন কৃষক · খরচ ৳৩২,০০০' },
      { cat: 'ইফতার মাহফিল', img: F('Iftar_beguni.JPG'), title: 'গ্রামবাসীর জন্য ইফতার মাহফিল', when: '২০ মার্চ ২০২৬', place: 'সগুনা কেন্দ্রীয় জামে মসজিদ', meta: '৩৫০ জন অংশ নেন · খরচ ৳৪১,২০০' },
      { cat: 'শীতবস্ত্র বিতরণ', img: F('Busy_farmer_at_winter_morning.jpg'), title: 'শীতবস্ত্র বিতরণ ২০২৫', when: '১৪ ডিসেম্বর ২০২৫', place: 'সগুনা সরকারি প্রাথমিক বিদ্যালয় মাঠ', meta: '২৬০ পরিবার উপকৃত · খরচ ৳৯২,০০০' }
    ].map(e => ({ ...e, metaColor: '#57534E', href: 'EventDetail.dc.html' }));
    const tab = this.state.tab;
    return {
      rootRef: this.rootRef, mode, isMobile: mode === 'mobile',
      tabs: ['আসন্ন', 'সম্পন্ন'].map((label, i) => ({ label, on: i === tab, off: i !== tab, pick: () => this.setState({ tab: i }) })),
      items: tab === 0 ? upcoming : done
    };
  }
}
</script>
</body>
</html>

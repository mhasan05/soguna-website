<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAFAF7;font-family:'Hind Siliguri',sans-serif;}a{color:#15803D;text-decoration:none;}a:hover{color:#14532D;text-decoration:underline;}</style>
</helmet>
<div ref="{{ rootRef }}" style="container-type:inline-size;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:#FAFAF7;color:#1C1917;font-size:16px;line-height:1.6;">
<div style="position:sticky;top:0;z-index:20;"><dc-import name="SiteHeader" mode="{{ mode }}" active="none" hint-size="100%,72px"></dc-import></div>

<div data-screen-label="আমার প্রোফাইল" style="max-width:760px;margin:0 auto;padding:clamp(20px,3cqw,40px) clamp(16px,3.5cqw,40px) clamp(40px,5cqw,64px);display:flex;flex-direction:column;gap:16px;">
  <a href="Dashboard.dc.html" style="align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>ড্যাশবোর্ড</a>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;">
    <div style="position:relative;width:96px;height:96px;flex:none;">
      <div style="width:96px;height:96px;border-radius:50%;background:#F0FDF4;border:3px solid #DCEFE1;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#15803D;box-sizing:border-box;">রা</div>
      <button aria-label="ছবি বদলান" style="position:absolute;right:-4px;bottom:-4px;width:44px;height:44px;border-radius:50%;border:3px solid #FAFAF7;background:#15803D;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></button>
    </div>
    <div style="flex:1;min-width:0;">
      <h1 style="margin:0;font-size:clamp(24px,3cqw,32px);font-weight:700;line-height:1.3;">মোঃ রাকিব হাসান</h1>
      <div style="font-size:16px;color:#57534E;">SAJS-0045 · সদস্য ২০২৩ থেকে</div>
    </div>
    <sc-if value="{{ viewing }}" hint-placeholder-val="{{ true }}"><button onClick="{{ edit }}" style="height:48px;padding:0 20px;border-radius:10px;border:1.5px solid #15803D;background:#fff;color:#15803D;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;">এডিট করুন</button></sc-if>
  </div>

  <sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
    <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:6px 18px 10px;">
      <h2 style="margin:12px 0 4px;font-size:18px;font-weight:700;color:#14532D;">{{ s.title }}</h2>
      <sc-for list="{{ s.rows }}" as="r">
        <sc-if value="{{ viewing }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F0EEE8;flex-wrap:wrap;"><span style="font-size:16px;color:#57534E;">{{ r.k }}</span><span style="font-size:17px;font-weight:600;text-align:right;">{{ r.v }}</span></div>
        </sc-if>
        <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
          <label style="display:flex;flex-direction:column;gap:4px;padding:8px 0;"><span style="font-size:16px;font-weight:600;">{{ r.k }}</span><input value="{{ r.v }}" readonly="{{ r.locked }}" style="height:52px;border-radius:10px;border:1.5px solid #D6D3CB;padding:0 14px;font-family:inherit;font-size:17px;background:{{ r.bg }};"></label>
        </sc-if>
      </sc-for>
    </div>
  </sc-for>

  <div style="background:#fff;border:1px solid #E7E5DF;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;">
    <h2 style="margin:0;font-size:18px;font-weight:700;color:#14532D;">প্রাইভেসি</h2>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;">
      <div><div style="font-size:17px;font-weight:600;">আমার ফোন নম্বর সদস্যরা দেখবে</div><div style="font-size:15px;color:#57534E;">বন্ধ করলে শুধু কমিটি দেখতে পাবে। ভিজিটর কখনো দেখে না।</div></div>
      <button onClick="{{ togglePhone }}" aria-label="ফোন নম্বর দেখানো" style="width:60px;height:34px;flex:none;border-radius:999px;border:none;background:{{ phoneTrack }};position:relative;cursor:pointer;"><span style="position:absolute;top:3px;left:{{ phoneKnob }};width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);"></span></button>
    </div>
  </div>

  <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
    <div style="position:sticky;bottom:76px;display:flex;gap:10px;background:#FAFAF7;padding:8px 0;">
      <button onClick="{{ cancel }}" style="height:56px;padding:0 22px;border-radius:12px;border:1.5px solid #D6D3CB;background:#fff;color:#44403C;font-family:inherit;font-size:18px;font-weight:600;cursor:pointer;">বাতিল</button>
      <button onClick="{{ cancel }}" style="flex:1;height:56px;border-radius:12px;border:none;background:#15803D;color:#fff;font-family:inherit;font-size:19px;font-weight:700;cursor:pointer;">সংরক্ষণ করুন</button>
    </div>
  </sc-if>
  <a href="Login.dc.html" style="align-self:center;min-height:48px;display:inline-flex;align-items:center;font-size:17px;color:#57534E;">লগআউট</a>
</div>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}"><div style="position:sticky;bottom:0;z-index:20;"><dc-import name="BottomNav" active="me" hint-size="100%,68px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 0, edit: false, showPhone: true };
  rootRef = React.createRef();
  componentDidMount() { const el = this.rootRef.current; if (!el) return; this.ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width })); this.ro.observe(el); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const m = this.props.mode; const mode = m && m !== 'auto' ? m : (this.state.w >= 900 ? 'desktop' : 'mobile');
    const row = (k, v, locked) => ({ k, v, locked: !!locked, bg: locked ? '#F5F5F4' : '#fff' });
    return {
      rootRef: this.rootRef, mode, isMobile: mode === 'mobile',
      viewing: !this.state.edit, editing: this.state.edit,
      edit: () => this.setState({ edit: true }), cancel: () => this.setState({ edit: false }),
      sections: [
        { title: 'মৌলিক তথ্য', rows: [row('নাম', 'মোঃ রাকিব হাসান'), row('বাবার নাম', 'মোঃ আব্দুস সালাম'), row('ফোন', '০১৭১২-৩৪৫৬৭৮', 1), row('জন্ম তারিখ', '১৪ মার্চ ১৯৯৮')] },
        { title: 'ঠিকানা ও পেশা', rows: [row('পাড়া', 'নদীপাড়া'), row('বর্তমানে থাকেন', 'ঢাকায়'), row('পেশা', 'গার্মেন্টস সুপারভাইজার'), row('শিক্ষা', 'স্নাতক')] },
        { title: 'রক্তদান', rows: [row('রক্তের গ্রুপ', 'B+'), row('রক্ত দিতে ইচ্ছুক', 'হ্যাঁ'), row('শেষ রক্তদান', '১০ আগস্ট ২০২৬')] }
      ],
      phoneTrack: this.state.showPhone ? '#15803D' : '#D6D3CB', phoneKnob: this.state.showPhone ? '29px' : '3px',
      togglePhone: () => this.setState(s => ({ showPhone: !s.showPhone }))
    };
  }
}
</script>
</body>
</html>
